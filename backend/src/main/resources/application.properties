# ===================================================
# Fusion3D Works - Spring Boot Production Configuration
# PostgreSQL Database (Neon Serverless)
# ===================================================
spring.application.name=fusion3d-backend

# Neon Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-long-cherry-b5kgya9a-pooler.c-7.us-east-2.aws.neon.tech:5432/Fusion3d_works%20?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_5Lhyq1VbBcSx}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate (Auto-create and update tables & schema)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# S3-Compatible Cloud Storage (Neon Object Storage for CAD STL/OBJ models and Customer Photos)
cloud.aws.s3.endpoint=${AWS_ENDPOINT_URL_S3:https://br-blue-bar-b5l8v16s.storage.c-7.us-east-2.aws.neon.tech}
cloud.aws.s3.access-key=${AWS_ACCESS_KEY_ID:nak_live_cdefb232a9154f1b805e86ac566b242f}
cloud.aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:nsk_live_3573202a8c89ff3bf08cb65bcfb75bd3b1e8edd196d0e0ceae0628e0e29e345c}
cloud.aws.s3.region=${AWS_REGION:us-east-2}
cloud.aws.s3.bucket-name=${S3_BUCKET_NAME:fusion3d-storage}

# Server Port (Render dynamically assigns $PORT; defaults to 8080 locally)
server.port=${PORT:8080}

# Multipart File Upload for large 3D models (STL, OBJ, 3MF, STEP) and photos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Seed initial default data if tables are empty
fusion3d.seed-default-data=true
