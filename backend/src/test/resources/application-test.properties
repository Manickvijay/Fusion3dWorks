spring.application.name=fusion3d-backend-test

# H2 In-Memory Database for fast automated unit tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Dummy S3 Config for Tests
cloud.aws.s3.endpoint=https://br-blue-bar-b5l8v16s.storage.c-7.us-east-2.aws.neon.tech
cloud.aws.s3.access-key=test_key
cloud.aws.s3.secret-key=test_secret
cloud.aws.s3.region=us-east-2
cloud.aws.s3.bucket-name=fusion3d-test-bucket

fusion3d.seed-default-data=false
